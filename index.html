    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .font-serif { font-family: 'Libre Baskerville', serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .font-condensed { font-family: 'Roboto Condensed', sans-serif; }
        .font-bengali { font-family: 'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; }
        .font-kalpurush { font-family: 'Kalpurush', 'SolaimanLipi', 'Noto Sans Bengali', sans-serif; }

        .font-noto-serif-bengali { font-family: 'Noto Serif Bengali', 'SolaimanLipi', serif; }
        .font-anek-bangla { font-family: 'Anek Bangla', 'Hind Siliguri', sans-serif; }
        
        /* Fix for text clipping and link wrapping */
        #resume-content, #resume-content * {
            line-height: 1.5 !important;
            overflow-wrap: anywhere !important;
            word-break: normal !important;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        body {
            overscroll-behavior-y: contain;
        }

        #resume-content {
            box-sizing: border-box;
            background: white;
        }

        @media print {
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            body * {
                visibility: hidden;
            }
            #resume-content, #resume-content * {
                visibility: visible;
            }
            #resume-content {
                position: static !important;
                width: 210mm !important;
                max-width: 210mm !important;
                margin: 0 auto !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                background: white !important;
            }
            .a4-page-sheet {
                width: 210mm !important;
                min-height: 297mm !important;
                height: 297mm !important;
                max-height: 297mm !important;
                margin: 0 !important;
                box-shadow: none !important;
                border: none !important;
                page-break-after: always !important;
                break-after: page !important;
                overflow: hidden !important;
                box-sizing: border-box !important;
            }
            .a4-page-sheet:last-child {
                page-break-after: auto !important;
                break-after: auto !important;
            }
            .a4-page-footer {
                display: flex !important;
                visibility: visible !important;
            }
            .page-break-avoid, tr, table, .break-inside-avoid, [data-avoid-break] {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }
            h1, h2, h3, h4, .section-title, [data-heading] {
                break-after: avoid !important;
                page-break-after: avoid !important;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }
